[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "module-recipe"
version = "2.0.0"
description = "Canonical nonlinear ISA-88/BatchML recipe graph"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.20"]

[tool.setuptools.packages.find]
where = ["."]
include = ["modplant_recipe*"]

